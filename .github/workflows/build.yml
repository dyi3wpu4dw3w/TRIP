name: TRIP Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Android location and microphone permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          permissions = [
              "ACCESS_COARSE_LOCATION",
              "ACCESS_FINE_LOCATION",
              "RECORD_AUDIO",
              "MODIFY_AUDIO_SETTINGS",
          ]
          additions = [
              f'    <uses-permission android:name="android.permission.{permission}" />'
              for permission in permissions
              if f"android.permission.{permission}" not in text
          ]
          features = [
              '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />',
              '    <uses-feature android:name="android.hardware.microphone" android:required="false" />',
          ]
          for feature in features:
              feature_name = feature.split('name="')[1].split('"')[0]
              if feature_name not in text:
                  additions.append(feature)
          if additions:
              text = text.replace("    <application", "\n".join(additions) + "\n    <application", 1)
              path.write_text(text)
          PY

      - name: Apply full-image TRIP launcher icon
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="https://raw.githubusercontent.com/dyi3wpu4dw3w/TRIP/main/public/file_00000000fee8824688a729099aac715b.png"
          curl --fail --location --retry 3 "$SOURCE_URL" --output /tmp/trip-source.png
          identify /tmp/trip-source.png
          RES="android/app/src/main/res"
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "$RES/mipmap-$density"
            # Legacy launcher icon: fit the complete source image without cropping.
            magick /tmp/trip-source.png -auto-orient -resize "${size}x${size}" -background '#18b99a' -gravity center -extent "${size}x${size}" "$RES/mipmap-$density/ic_launcher.png"
            # Adaptive foreground: keep the full image inside the Android safe zone.
            fg=$((size * 66 / 100))
            magick /tmp/trip-source.png -auto-orient -resize "${fg}x${fg}" -background none -gravity center -extent "${size}x${size}" "$RES/mipmap-$density/ic_launcher_foreground.png"
          done
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/values"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cat > "$RES/values/ic_launcher_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#18B99A</color>
          </resources>
          EOF

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TRIP-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
